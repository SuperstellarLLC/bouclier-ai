name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "22"
  SKIP_ENV_VALIDATION: "true"

jobs:
  build-desktop:
    name: Build Desktop App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Build patterns (needed for Swift resources)
        run: pnpm install --frozen-lockfile && pnpm --filter @ilvarion/patterns build

      - name: Sync patterns to Swift resources
        run: apps/desktop/scripts/sync-patterns.sh

      - name: Build release binary
        run: cd apps/desktop && swift build -c release

      - name: Create .app bundle
        run: |
          APP_DIR="Ilvarion.app/Contents/MacOS"
          RES_DIR="Ilvarion.app/Contents/Resources"
          mkdir -p "$APP_DIR" "$RES_DIR"
          cp apps/desktop/.build/release/Ilvarion "$APP_DIR/"
          cp apps/desktop/.build/release/ilvarion-mcp-wrapper "$APP_DIR/"
          # Copy the resource bundle with patterns.json
          cp -r apps/desktop/.build/release/Ilvarion_Ilvarion.bundle "$RES_DIR/" 2>/dev/null || true
          cat > "Ilvarion.app/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Ilvarion</string>
            <key>CFBundleIdentifier</key><string>dev.ilvarion.app</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME}</string>
            <key>CFBundleExecutable</key><string>Ilvarion</string>
            <key>LSUIElement</key><true/>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
          </dict>
          </plist>
          PLIST

      - name: Archive .app
        run: zip -r Ilvarion-macOS.zip Ilvarion.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: Ilvarion-macOS.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ilvarion-macOS.zip
