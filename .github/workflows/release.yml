# Tag-verifier and draft-release workflow.
#
# When a `v*` tag is pushed, this workflow rebuilds and tests the
# desktop app from that exact tag, uploads the unsigned build as an
# artifact for QA, and opens a draft GitHub release populated from
# the matching `## [VERSION]` section of CHANGELOG.md.
#
# Signing, notarisation, DMG creation, and Sparkle appcast publication
# happen locally on a maintainer's machine via
# `apps/desktop/scripts/release.sh` — macOS code-signing in CI is
# fragile and our threat model puts the signing keys on a single
# maintainer-held machine. The draft release is finalised manually
# after the signed DMG is uploaded to the download host.

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag builds & tests pass
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Verify tag and product versions agree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SITE_VERSION=$(sed -nE 's/^export const APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' apps/site/src/lib/constants.ts)
          PROJECT_VERSION=$(sed -nE 's/^        MARKETING_VERSION: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' apps/desktop/project.yml)
          DESKTOP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/desktop/Sources/Bouclier/Resources/Info.plist)
          APPCAST_VERSION=$(sed -nE 's/^[[:space:]]*<sparkle:version>([^<]+)<\/sparkle:version>$/\1/p' apps/site/public/appcast.xml | head -n 1)
          APPCAST_SHORT_VERSION=$(sed -nE 's/^[[:space:]]*<sparkle:shortVersionString>([^<]+)<\/sparkle:shortVersionString>$/\1/p' apps/site/public/appcast.xml | head -n 1)
          test "$VERSION" = "$SITE_VERSION"
          test "$VERSION" = "$PROJECT_VERSION"
          test "$VERSION" = "$DESKTOP_VERSION"
          test "$VERSION" = "$APPCAST_VERSION"
          test "$VERSION" = "$APPCAST_SHORT_VERSION"
          grep -Fq "## [$VERSION]" CHANGELOG.md

      - name: Build shared patterns package
        run: pnpm --filter @bouclier-ai/patterns build

      - name: Sync patterns into desktop bundle
        run: apps/desktop/scripts/sync-patterns.sh

      - name: Build and archive unsigned app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}" apps/desktop/scripts/build-app.sh --release
          ditto -c -k --keepParent \
            apps/desktop/build/Bouclier-ai.app \
            "apps/desktop/build/Bouclier-ai-${GITHUB_REF_NAME}-unsigned.zip"

      - name: Run Swift tests
        working-directory: apps/desktop
        run: swift test

      - name: Upload unsigned packaged app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bouclier-${{ github.ref_name }}-unsigned
          path: apps/desktop/build/Bouclier-ai-${{ github.ref_name }}-unsigned.zip
          retention-days: 14
          if-no-files-found: error

  draft-release:
    name: Open draft GitHub release
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract CHANGELOG section for this tag
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting changelog section for ${VERSION}"
          {
            echo 'BODY<<__EOF__'
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.BODY }}

            ---

            > Signed DMG and Sparkle appcast are published separately via
            > `apps/desktop/scripts/release.sh` on a maintainer machine.
            > This release will be promoted from *draft* once those
            > artifacts are uploaded.
