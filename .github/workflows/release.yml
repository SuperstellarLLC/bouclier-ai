name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  SKIP_ENV_VALIDATION: "true"
  APP_NAME: "Ilvarion"
  BUNDLE_ID: "com.ilvarion.app"

jobs:
  build-desktop:
    name: Build, Sign & Notarize Desktop App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # ── Build patterns ────────────────────
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile && pnpm --filter @ilvarion/patterns build
      - run: apps/desktop/scripts/sync-patterns.sh

      # ── Build Swift ───────────────────────
      - name: Build release binaries
        run: cd apps/desktop && swift build -c release

      # ── Create .app bundle ────────────────
      - name: Create .app bundle
        run: |
          APP="${APP_NAME}.app"
          CONTENTS="${APP}/Contents"
          mkdir -p "${CONTENTS}/MacOS" "${CONTENTS}/Resources"

          # Binaries
          cp apps/desktop/.build/release/Ilvarion "${CONTENTS}/MacOS/"
          cp apps/desktop/.build/release/ilvarion-mcp-wrapper "${CONTENTS}/MacOS/"

          # Resources (patterns.json bundle)
          cp -r apps/desktop/.build/release/Ilvarion_Ilvarion.bundle "${CONTENTS}/Resources/" 2>/dev/null || true

          # Info.plist
          cat > "${CONTENTS}/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key><string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleExecutable</key><string>${APP_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSUIElement</key><true/>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHumanReadableCopyright</key><string>Copyright 2026 Ilvarion</string>
          </dict>
          </plist>
          EOF

      # ── Code Sign ─────────────────────────
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign app bundle
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --entitlements apps/desktop/Ilvarion.entitlements \
            "${APP_NAME}.app"

      # ── Create DMG ────────────────────────
      - name: Create DMG
        run: |
          # Create a temporary DMG folder
          DMG_DIR=$RUNNER_TEMP/dmg
          mkdir -p "$DMG_DIR"
          cp -R "${APP_NAME}.app" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"

          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "${APP_NAME}-${GITHUB_REF_NAME}-macOS.dmg"

      # ── Notarize ──────────────────────────
      - name: Notarize DMG
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "${APP_NAME}-${GITHUB_REF_NAME}-macOS.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "${APP_NAME}-${GITHUB_REF_NAME}-macOS.dmg"

      # ── Also create unsigned zip for testing ─
      - name: Create zip archive
        run: zip -r "${APP_NAME}-${GITHUB_REF_NAME}-macOS.zip" "${APP_NAME}.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            ${{ env.APP_NAME }}-${{ github.ref_name }}-macOS.dmg
            ${{ env.APP_NAME }}-${{ github.ref_name }}-macOS.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.dmg
            *.zip
