name: Detection miss
description: Bouclier.ai missed a prompt injection or PII that it should have caught.
title: "detection: "
labels: [detection, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Detection is best-effort and probabilistic — false negatives happen. Reports here directly improve the bundled pattern set.

        **Important.** Do not paste real customer or personal data. Synthesise a payload that reproduces the miss.

  - type: input
    id: version
    attributes:
      label: Version
      description: Bouclier.ai version + pattern pack version (menu bar → About).
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What was missed?
      options:
        - Prompt injection pattern
        - PII / regulated identifier
        - Secret / credential
        - Multimodal (image, PDF, or audio)
        - Other
    validations:
      required: true

  - type: textarea
    id: payload
    attributes:
      label: Synthetic payload
      description: Minimal example. Wrap in a code fence.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have been detected?
      description: Pattern name, PII type, or attack category.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Provider (OpenAI, Anthropic, Gemini, ...), encoding tricks used, locale, anything else useful.
