name: Bug report
description: Something in Bouclier.ai is not working as expected.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Before submitting, please:

        - Search [existing issues](https://github.com/SuperstellarLLC/ilvarion/issues) and the [discussions](https://github.com/SuperstellarLLC/ilvarion/discussions) to avoid duplicates.
        - **Do not** include screenshots or logs that contain real PII, credentials, or prompt content. Bouclier.ai logs do not capture request bodies, but anything you paste here is public.

  - type: input
    id: version
    attributes:
      label: Version
      description: Bouclier.ai version (menu bar → About) and macOS version.
      placeholder: "Bouclier.ai 0.4.0 on macOS 15.3 (Apple Silicon)"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - DMG from bouclier.ai
        - Self-built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include the app or SDK you were using when the proxy intercepted the request.
      placeholder: |
        1. Open ChatGPT desktop app
        2. Send a prompt containing an IBAN
        3. Inspect Bouclier.ai → Activity log
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From `~/Library/Application Support/ai.bouclier.app/logs/` or `Console.app` filtered by `ai.bouclier`. Redact request content.
      render: shell
