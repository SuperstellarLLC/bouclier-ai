name: Bug report
description: Something in Bouclier.ai is not working as expected.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Before submitting, please:

        - Search [existing issues](https://github.com/SuperstellarLLC/bouclier-ai/issues) and the [discussions](https://github.com/SuperstellarLLC/bouclier-ai/discussions) to avoid duplicates.
        - **Do not** include screenshots or logs that contain real PII, credentials, or prompt content. Bouclier.ai logs do not capture request bodies, but anything you paste here is public.

  - type: input
    id: version
    attributes:
      label: Version
      description: Bouclier.ai version (menu bar → About) and macOS version.
      placeholder: "Bouclier.ai 0.x.y on macOS 15.x (Apple silicon)"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - DMG from bouclier.ai
        - Self-built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include the compatible agent or SDK you explicitly routed through Bouclier's gateway.
      placeholder: |
        1. Enable Protection, then open a new terminal
        2. Run a request through Claude Code or a supported provider SDK
        3. Inspect Bouclier.ai → Activity log
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From the Bouclier menu, choose Export Diagnostics…, or copy relevant entries from Console.app filtered by subsystem `ai.bouclier.app`. Review and redact anything sensitive before posting.
