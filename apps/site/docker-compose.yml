services:
  app:
    build:
      context: ../..
      dockerfile: apps/site/Dockerfile
      args:
        DOWNLOAD_REDIRECT_BASE: "${DOWNLOAD_REDIRECT_BASE:?set DOWNLOAD_REDIRECT_BASE in apps/site/.env.local}"
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - BOUCLIER_DEPLOYMENT_ENV=production
      - DOWNLOAD_REDIRECT_BASE=${DOWNLOAD_REDIRECT_BASE:?set DOWNLOAD_REDIRECT_BASE in apps/site/.env.local}
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
