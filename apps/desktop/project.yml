name: Bouclier
options:
  bundleIdPrefix: ai.bouclier
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

# This is the optional XcodeGen project for IDE users. The signed release
# remains built by scripts/build-app.sh from Package.swift, so this file
# must mirror the SwiftPM targets rather than defining a second product.
# To sign an IDE build on another Apple Developer team, override the team
# and profile in your own checkout.
settings:
  base:
    DEVELOPMENT_TEAM: U86PR842AK
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Superstellar LLC (U86PR842AK)"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.76.0"
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: "2.29.0"
  swift-nio-transport-services:
    url: https://github.com/apple/swift-nio-transport-services.git
    from: "1.23.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "0.1.12"

targets:
  BouclierCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/BouclierCore
    settings:
      base:
        SWIFT_VERSION: "6.0"

  Bouclier:
    type: application
    platform: macOS
    sources:
      - path: Sources/Bouclier
        excludes:
          - Resources/Info.plist
          - Resources/GeneratedInfo.plist
          - Resources/Bouclier.icns
          - Resources/PromptGuardTokenizer/.cache
      - path: icon/Bouclier.icns
    dependencies:
      - target: BouclierCore
      - package: GRDB
      - package: swift-nio
        product: NIO
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOTLS
      - package: swift-nio-ssl
        product: NIOSSL
      - package: swift-nio-transport-services
        product: NIOTransportServices
      - package: Sparkle
      - package: swift-transformers
        product: Transformers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.bouclier.app
        PROVISIONING_PROFILE_SPECIFIER: "Bouclier"
        CODE_SIGN_ENTITLEMENTS: Bouclier.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.9.10"
        CURRENT_PROJECT_VERSION: "8"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    info:
      path: Sources/Bouclier/Resources/GeneratedInfo.plist
      properties:
        CFBundleName: Bouclier
        CFBundleDisplayName: Bouclier
        CFBundleIconFile: Bouclier
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        SUPublicEDKey: "QNMtWO7H9Z9Hv1J9bAsunleicPvJVP2bMJQezjV3vmM="
        SUFeedURL: "https://www.bouclier.ai/appcast.xml"
        SUEnableAutomaticChecks: true

  bouclier-ai-mcp-wrapper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MCPWrapper
    dependencies:
      - target: BouclierCore
    settings:
      base:
        SWIFT_VERSION: "6.0"

  bouclier-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/BouclierCLI
    dependencies:
      - target: BouclierCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
